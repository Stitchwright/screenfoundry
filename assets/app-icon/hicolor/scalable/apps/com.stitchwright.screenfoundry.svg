<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>ScreenFoundry</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <!-- the mesh: a fine square weave -->
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f6f1e7"/>
      <path d="M 0 0.6 H 12 M 0.6 0 V 12" stroke="#dadde4" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  <g clip-path="url(#tile)">
    <!-- field -->
    <rect width="512" height="512" fill="#16233f"/>
    <!-- the screen: an aluminium frame around the mesh, with a soft shadow -->
    <rect x="64" y="108" width="384" height="352" rx="38" fill="#0e1830" opacity="0.55" transform="translate(0 10)"/>
    <rect x="64" y="108" width="384" height="352" rx="38" fill="#dfe4ed"/>
    <rect x="76" y="120" width="360" height="328" rx="28" fill="#c3cad8"/>
    <rect x="94" y="138" width="324" height="292" rx="14" fill="url(#mesh)"/>
    <!-- the print: a halftone ramp, large dots on the left that shrink toward the squeegee -->
    <g fill="#e8365f">
      <circle cx="128" cy="188" r="22"/> <circle cx="128" cy="240" r="22"/> <circle cx="128" cy="292" r="22"/> <circle cx="128" cy="344" r="22"/> <circle cx="128" cy="396" r="22"/>
      <circle cx="172" cy="188" r="20"/> <circle cx="172" cy="240" r="20"/> <circle cx="172" cy="292" r="20"/> <circle cx="172" cy="344" r="20"/> <circle cx="172" cy="396" r="20"/>
      <circle cx="216" cy="188" r="17"/> <circle cx="216" cy="240" r="17"/> <circle cx="216" cy="292" r="17"/> <circle cx="216" cy="344" r="17"/> <circle cx="216" cy="396" r="17"/>
      <circle cx="260" cy="188" r="14"/> <circle cx="260" cy="240" r="14"/> <circle cx="260" cy="292" r="14"/> <circle cx="260" cy="344" r="14"/> <circle cx="260" cy="396" r="14"/>
      <circle cx="304" cy="188" r="10"/> <circle cx="304" cy="240" r="10"/> <circle cx="304" cy="292" r="10"/> <circle cx="304" cy="344" r="10"/> <circle cx="304" cy="396" r="10"/>
      <circle cx="348" cy="188" r="6"/> <circle cx="348" cy="240" r="6"/> <circle cx="348" cy="292" r="6"/> <circle cx="348" cy="344" r="6"/> <circle cx="348" cy="396" r="6"/>
    </g>
    <!-- the squeegee: rubber blade across the screen, a stem and a handle above the frame -->
    <rect x="379" y="142" width="26" height="296" rx="9" fill="#101b34"/>
    <rect x="379" y="142" width="9" height="296" rx="4.5" fill="#34436a"/>
    <rect x="381" y="86" width="22" height="64" rx="6" fill="#aab3c6"/>
    <rect x="338" y="40" width="108" height="56" rx="24" fill="#eef1f6"/>
    <rect x="338" y="72" width="108" height="24" rx="12" fill="#c7cedb"/>
  </g>
</svg>
